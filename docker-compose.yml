services:
  db:
    image: postgres:16-alpine
    container_name: software-agent-postgres
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - software-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  software-agent-postgres:
